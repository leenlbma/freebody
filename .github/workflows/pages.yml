name: Deploy to GitHub Pages

# 仅在仓库公开（或仓库变量 ENABLE_PAGES=true）且已在 Settings → Pages 选择
# "GitHub Actions" 作为来源时部署。启用方法见 README「部署到 GitHub Pages」。
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event.repository.private == false || vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm run build
      - run: npm run check
      - name: Assemble site
        run: |
          mkdir -p _site
          cp index.html sw.js manifest.webmanifest _site/
          cp -r icons _site/
          mkdir -p _site/assets && cp assets/*.svg _site/assets/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
