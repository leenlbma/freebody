name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 构建产物与源码一致
        run: git diff --exit-code -- index.html sw.js
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - name: 开发依赖许可证
        run: npm run licenses
      - name: 单元测试与覆盖率（纯逻辑模块行覆盖 ≥ 90%）
        run: node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-lines=90 tests/*.test.js

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - name: 端到端测试（Chromium 收集覆盖率）
        run: npm run test:e2e
        env:
          CI: '1'
          FB_COVERAGE: '1'
      - name: 端到端覆盖率（src/app 合计 ≥ 65%）
        run: node scripts/e2e-coverage.js --min 65
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
