name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: 构建产物与源码一致
        run: git diff --exit-code -- index.html sw.js
      - run: npm run check
      - run: npm run lint
      - run: npm run typecheck
      - name: 单元测试与覆盖率（纯逻辑模块行覆盖 ≥ 85%）
        run: node --test --experimental-test-coverage --test-coverage-include='src/**' --test-coverage-lines=85 tests/

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run test:e2e
        env:
          CI: '1'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: test-results/
          retention-days: 7
